[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "automate-data-analyzer"
version = "0.1.0"
description = "Importação e análise automática de CSV, TXT, XML e SQL em SQLite"
requires-python = ">=3.10"

[project.scripts]
data-analyzer = "data_analyzer.__main__:main"

[tool.setuptools.packages.find]
include = ["data_analyzer*"]